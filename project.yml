# XcodeGen spec for AURA.
#
# This file is a RECOVERY PATH, not the day-to-day source of truth. `AURA.xcodeproj` is checked in
# and is what you open. If that project file is ever corrupted or rejected by Xcode, run:
#
#     brew install xcodegen && xcodegen generate
#
# and the equivalent project will be rebuilt from this description.

name: AURA
options:
  bundleIdPrefix: com.aura
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  AURA:
    type: application
    platform: iOS
    sources:
      - path: AURA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aura.assistant
        PRODUCT_NAME: AURA
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: AURA uses the microphone so you can talk to your assistant instead of typing.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: AURA converts your speech to text so it can understand what you asked.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: AURA reads and creates calendar events when you ask about or add to your schedule.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: AURA creates reminders when you ask it to remind you about something.
        INFOPLIST_KEY_NSContactsUsageDescription: AURA looks up contacts so it knows who the people you mention are.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: AURA uses your location for local answers such as weather and travel time.

  AURATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AURATests
    dependencies:
      - target: AURA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aura.assistant.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AURA:
    build:
      targets:
        AURA: all
    test:
      targets:
        - AURATests
      gatherCoverageData: true
    run:
      config: Debug
