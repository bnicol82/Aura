name: Build and test

# Why this exists
#
# AURA is an iOS app, and Xcode only runs on macOS. When the person maintaining this repository has no
# Mac, GitHub's macOS runners *are* the compiler — and for a public repository they are free. Every
# push is built and tested here, so "does it compile" is answered by the repository rather than by
# whoever happens to own a laptop.
#
# The error report is echoed into the job log on purpose, between clear markers. That makes it readable
# through the GitHub API, which is how an agent working on this repo reads its own compiler output.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older one. No point burning ten minutes compiling a commit that has
# already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed only by the screenshot commit step.
permissions:
  contents: write

jobs:
  build:
    name: Build and test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Report and select toolchain
        run: |
          echo "===== TOOLCHAIN ====="
          sw_vers
          echo
          echo "Xcode versions present on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
          echo

          DEFAULT_VERSION=$(xcodebuild -version 2>/dev/null | head -1 || echo "unknown")
          echo "Default: $DEFAULT_VERSION"

          DEFAULT_MAJOR=$(echo "$DEFAULT_VERSION" | sed -E 's/Xcode ([0-9]+).*/\1/')

          # AURA targets iOS 26, so FoundationModels and the new Speech API need Xcode 26+. If the
          # runner's default is older, switch to the newest one installed rather than failing on an
          # import error that looks like a code bug but is a toolchain problem.
          if ! [ "$DEFAULT_MAJOR" -ge 26 ] 2>/dev/null; then
            NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            if [ -n "$NEWEST" ]; then
              echo "Default is older than Xcode 26 — switching to $NEWEST"
              sudo xcode-select -s "$NEWEST/Contents/Developer"
            fi
          fi

          echo
          echo "Selected: $(xcodebuild -version | head -1)"
          echo "Swift:    $(swift --version 2>&1 | head -1)"

          {
            echo "## Toolchain"
            echo "- macOS: \`$(sw_vers -productVersion)\`"
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the project file
        id: project
        run: |
          # AURA.xcodeproj was hand-authored without Xcode, so it being unreadable is a known
          # possibility with a known fix rather than a mystery. Check it explicitly, and regenerate from
          # the checked-in XcodeGen spec if Xcode rejects it.
          if xcodebuild -list -project AURA.xcodeproj > /tmp/project-list.txt 2>&1; then
            echo "Project file is readable."
            cat /tmp/project-list.txt
            echo "regenerated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Xcode could not read AURA.xcodeproj:"
            cat /tmp/project-list.txt
            echo
            echo "Regenerating from project.yml with XcodeGen..."
            brew install xcodegen
            xcodegen generate
            xcodebuild -list -project AURA.xcodeproj
            echo "regenerated=true" >> "$GITHUB_OUTPUT"
            echo "> ⚠️ \`AURA.xcodeproj\` was rejected by Xcode and regenerated from \`project.yml\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        id: build
        continue-on-error: true
        run: ./Scripts/build.sh

      - name: Report build result
        if: always()
        run: |
          # Printed because the GitHub API's per-step `conclusion` is NOT the truth for a
          # `continue-on-error` step: a failed step reports conclusion "success" and only `outcome` says
          # "failure". Anyone reading this job through the API — including an agent — will misread a failed
          # run as green unless the real outcomes are in the log. That has already happened once here.
          echo "STEP OUTCOME build=${{ steps.build.outcome }}"

          echo "===== BEGIN BUILD REPORT ====="
          if [ -s build/errors.txt ]; then
            cat build/errors.txt
          else
            echo "(no errors or warnings recorded)"
          fi
          echo "===== END BUILD REPORT ====="

          {
            echo "## Build"
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "✅ **Succeeded**"
            else
              echo "❌ **Failed**"
            fi
            echo
            if [ -s build/errors.txt ]; then
              ERRORS=$(grep -c "error: " build/errors.txt || true)
              WARNINGS=$(grep -c "warning: " build/errors.txt || true)
              echo "${ERRORS:-0} error(s), ${WARNINGS:-0} warning(s)"
              echo
              echo '```'
              # Capped so a wall of warnings cannot bury the errors in the summary view.
              grep "error: " build/errors.txt | head -60 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        id: test
        # Pointless to run when nothing compiled — and a misleading "tests failed" would hide the
        # actual cause.
        if: steps.build.outcome == 'success'
        continue-on-error: true
        # A hung test would otherwise run to the job's 60-minute cap, and GitHub does not serve the log
        # of a *running* job — so a deadlock is invisible until an hour has passed, and then looks like
        # a timeout rather than naming itself. A full suite takes about four minutes; twelve is generous
        # headroom and still ends the job while the log is worth reading. This has already cost three
        # runs.
        timeout-minutes: 12
        run: ./Scripts/test.sh

      - name: Report test result
        if: always() && steps.build.outcome == 'success'
        run: |
          # See the note in "Report build result": `outcome`, not `conclusion`, is the real result.
          echo "STEP OUTCOME test=${{ steps.test.outcome }}"

          echo "===== BEGIN TEST REPORT ====="
          if [ -s build/test-results.txt ]; then
            cat build/test-results.txt
          else
            echo "(no failures recorded)"
          fi
          echo "===== END TEST REPORT ====="

          # A hang produces no failure lines at all, so the report above is empty and says nothing about
          # why. These two sections are what make a hang diagnosable: the tests that started and never
          # finished are, by definition, the ones that were stuck.
          if [ "${{ steps.test.outcome }}" != "success" ] && [ -s build/test-full.log ]; then
            echo "===== STARTED AND NEVER FINISHED ====="
            grep -oE 'Test .* started\.' build/test-full.log \
              | sed -E 's/^Test (.*) started\.$/\1/' | sort -u > /tmp/started.txt || true
            grep -oE 'Test .* (passed|failed|skipped)' build/test-full.log \
              | sed -E 's/^Test (.*) (passed|failed|skipped)$/\1/' | sort -u > /tmp/finished.txt || true
            if [ -s /tmp/started.txt ]; then
              comm -23 /tmp/started.txt /tmp/finished.txt || true
            else
              echo "(no test-start lines — the suite never got that far)"
            fi
            echo "===== END ====="

            echo "===== LAST 40 LINES OF THE RAW TEST LOG ====="
            tail -40 build/test-full.log || true
            echo "===== END ====="
          fi

          {
            echo "## Tests"
            if [ "${{ steps.test.outcome }}" = "success" ]; then
              echo "✅ **Passed**"
            else
              echo "❌ **Failed**"
              echo
              echo '```'
              head -60 build/test-results.txt 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture screenshots
        id: screenshots
        # Only worth doing when the app actually built. Non-fatal: a missing screenshot is a
        # documentation gap, not a broken build, and it must not turn a green run red.
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./Scripts/screenshots.sh

      - name: Commit screenshots
        # Pushed back to the branch so they are viewable on github.com from a phone, which is the whole
        # point — the person reviewing this has no Mac and cannot run the app.
        #
        # The commit message carries GitHub's skip-CI marker, which is what stops this push from
        # triggering another run and looping forever.
        #
        # WARNING for anyone writing commit messages by hand: GitHub scans the whole message, body
        # included, for that marker. Mentioning it in prose — even inside backticks, even while
        # explaining this very mechanism — silently skips your run. That has already happened once here.
        # Say "the skip-CI marker", never the literal token.
        #
        # Non-fatal on purpose: if a concurrent push makes this a non-fast-forward, the next run
        # regenerates the images anyway.
        if: steps.screenshots.outcome == 'success' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/SCREENSHOTS.md

          if git diff --cached --quiet; then
            echo "Screens are unchanged since the last run — nothing to commit."
            exit 0
          fi

          COUNT=$(git diff --cached --name-only | grep -c "docs/screenshots/" || true)
          git commit -m "Update screenshots from CI (${COUNT:-0} changed) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "## Screens"
            echo
            echo "${COUNT:-0} image(s) updated — [browse them](../blob/${GITHUB_REF_NAME}/docs/SCREENSHOTS.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Set job status
        if: always()
        run: |
          # The build and test steps are `continue-on-error` so their reports always run. The job's own
          # status has to reflect reality, so it is set explicitly here.
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build failed — see the build report above."
            exit 1
          fi
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "Tests failed — see the test report above."
            exit 1
          fi
          echo "Build and tests both green."
